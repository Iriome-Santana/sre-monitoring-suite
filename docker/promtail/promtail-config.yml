server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sre-monitoring-suite
    static_configs:
      - targets:
          - localhost
        labels:
          job: sre-monitoring-suite
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            component: component
      - labels:
          level:
          component: